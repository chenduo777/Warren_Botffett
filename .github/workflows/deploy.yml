name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:    # 也允許手動觸發（GitHub UI 上「Run workflow」按鈕）

# 同一時間只跑一次 deploy，避免兩個 push 連發互相覆蓋
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  deploy:
    name: Deploy to GCP VM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ]    && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_PORT" ]    && missing="$missing DEPLOY_PORT"
          [ -z "$DEPLOY_USER" ]    && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi
          echo "All four secrets present"

      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # TOFU host fingerprint capture (acceptable for self-managed VM)
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude 'wbot/' \
              --exclude 'volumes/' \
              --exclude '.env' \
              --exclude 'chroma_db/' \
              --exclude '.pytest_cache/' \
              --exclude '__pycache__/' \
              -e "ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
              ./ \
              "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/warren-botffett/"

      - name: Build and restart stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'set -e; cd ~/warren-botffett && docker compose up -d --build'

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Give bot time to start; then check it's running and not stuck restarting
          sleep 20
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'cd ~/warren-botffett && \
               status=$(docker compose ps --format json bot | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get(\"State\",\"unknown\"))") && \
               echo "bot state: $status" && \
               [ "$status" = "running" ] || (docker compose logs --tail 50 bot; exit 1)'

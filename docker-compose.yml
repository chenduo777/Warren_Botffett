services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.15
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "127.0.0.1:8000:3000"
    depends_on:
      - "standalone"

  postgres:
    container_name: bot-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Loopback-only binding kept for host-side psql inspection. The bot
    # itself reaches postgres via the internal `postgres:5432` hostname.
    ports:
      - "127.0.0.1:5432:5432"

  # One-shot init: builds the Milvus collection if it is missing, then exits.
  # `build_index.py` is idempotent — it skips when the collection already
  # exists, so this service is safe to run on every `docker compose up`.
  # Use `docker compose run --rm index-init python build_index.py --force`
  # to rebuild from scratch (e.g. after editing data/letters.txt).
  index-init:
    container_name: warren-bot-index-init
    build: .
    image: warren-bot:local
    env_file: .env
    command: ["python", "build_index.py", "--milvus-uri", "http://standalone:19530"]
    depends_on:
      standalone:
        condition: service_healthy
    restart: "no"

  bot:
    container_name: warren-bot
    build: .
    image: warren-bot:local
    env_file: .env
    environment:
      # Override host-friendly defaults with internal service hostnames so
      # the same .env can be used both on the host and inside compose.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}?sslmode=disable
    command: ["python", "run_bot.py", "--milvus-uri", "http://standalone:19530"]
    depends_on:
      standalone:
        condition: service_healthy
      postgres:
        condition: service_healthy
      index-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
    name: milvus
